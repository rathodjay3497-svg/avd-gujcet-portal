name: Backend Deploy

on:
  push:
    branches: [ master, release2.2/hpcl ]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      AWS_REGION: ap-south-1
      LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Install runtime dependencies
        run: |
          pip install -r requirements.txt

      - name: Build Lambda deployment package
        run: |
          python build_linux_package.py

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Backup current Lambda code
        run: |
          echo "Attempting to backup current Lambda code..."
          CODE_URL=$(aws lambda get-function --function-name $LAMBDA_FUNCTION_NAME --query 'Code.Location' --output text)
          if [ ! -z "$CODE_URL" ] && [ "$CODE_URL" != "None" ]; then
            curl -L -o backup.zip "$CODE_URL"
            echo "✅ Backup saved to backup.zip"
          else
            echo "⚠️  No existing code found or unable to get backup URL."
          fi
        continue-on-error: true

      - name: Update Lambda function code
        id: deploy
        run: |
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION_NAME \
            --zip-file fileb://build/deployment_package.zip

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated --function-name $LAMBDA_FUNCTION_NAME

      - name: Run Smoke Test
        id: smoke_test
        run: |
          # Try to get API URL (assumes Function URL or provided secret)
          VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}"
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "Fetching Lambda Function URL..."
            VITE_API_BASE_URL=$(aws lambda get-function-url-config --function-name $LAMBDA_FUNCTION_NAME --query 'FunctionUrl' --output text || echo "")
          fi
          
          if [ -z "$VITE_API_BASE_URL" ] || [ "$VITE_API_BASE_URL" == "None" ]; then
            echo "❌ Error: VITE_API_BASE_URL not found. Please set secrets.VITE_API_BASE_URL or enable Lambda Function URL."
            exit 1
          fi
          
          echo "Running smoke test against $VITE_API_BASE_URL"
          python scripts/smoke_test.py "$VITE_API_BASE_URL"

      - name: Rollback on Failure
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          if [ -f backup.zip ]; then
            echo "🚨 Smoke test failed! Rolling back to previous stable version..."
            aws lambda update-function-code \
              --function-name $LAMBDA_FUNCTION_NAME \
              --zip-file fileb://backup.zip
            echo "✅ Rollback complete."
          else
            echo "❌ Cannot rollback: backup.zip not found."
          fi